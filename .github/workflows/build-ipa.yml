name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project BrigadeEnfants.xcodeproj \
            -scheme BrigadeEnfants \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BrigadeEnfants.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload BrigadeEnfants.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BrigadeEnfants-IPA
          path: BrigadeEnfants.ipa
