name: BrigadeEnfants
options:
  bundleIdPrefix: fr.stilpro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BrigadeEnfants:
    type: application
    platform: iOS
    sources:
      - BrigadeEnfants
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.stilpro.brigadeenfants
        PRODUCT_NAME: BrigadeEnfants
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Brigade des Enfants"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Le microphone est utilisé pendant l'appel vocal fictif."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "La reconnaissance vocale transforme la conversation en texte pour la Brigade fictive."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
